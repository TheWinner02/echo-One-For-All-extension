org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Can be music, tracker or lyrics
extType=music
extId=one_for_all
extClass=OneForAllExtension

extIconUrl=data:image/png;base64,
extName=One For All
extDescription=One extension. Independent accounts, shared metadata and resilient multi-source music playback.

extAuthor=TheWinner02
extAuthorUrl=https://github.com/TheWinner02

extRepoUrl=https://github.com/TheWinner02/echo-one-for-all-extension
extUpdateUrl=https://api.github.com/repos/TheWinner02/echo-one-for-all-extension/releases
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
android.enableAppCompileTimeRClass=true
android.usesSdkInManifest.disallowed=true
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false

# Progressive versioning variables
extVersionCode=1
extVersionName=v1.0.0