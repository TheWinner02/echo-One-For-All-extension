[versions]
echoCommon = "1.0.0"
kotlin = "2.4.10"
agp = "9.3.1"
gradleShadow = "9.6.1"

[libraries]
protobuf-java = { module = "com.google.protobuf:protobuf-java", version = "4.35.1" }
ytmkt = { module = "dev.toastbits:ytm-kt", version = "0.4.3" }
newpipe = { module = "com.github.teamnewpipe:NewPipeExtractor", version = "v0.27.1" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version = "3.5.2" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version = "3.5.2" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version = "3.5.2" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version = "3.5.2" }

echo-common = { module = "dev.brahmkshatriya.echo:common", version.ref = "echoCommon" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
junit = { module = "junit:junit", version = "4.13.2" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.11.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
gradle-shadow = { id = "com.gradleup.shadow", version.ref = "gradleShadow" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }


google-protobuf = { id = "com.google.protobuf", version = "0.10.0" }
